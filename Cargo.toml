[package]
name = "wayther"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.10"
gtk4-layer-shell = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
toml = "0.8"
